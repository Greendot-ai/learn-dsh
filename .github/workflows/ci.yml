name: Course checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-course:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
